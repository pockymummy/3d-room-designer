<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Room Designer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 12px;
        background: rgba(30, 30, 30, 0.85);
        color: #eee;
        font: 14px system-ui, sans-serif;
        border-radius: 6px;
      }
      #ui .color-field {
        margin: 6px 0 10px;
      }
      #ui .color-field > span {
        display: block;
        margin-bottom: 4px;
      }
      #ui .react-colorful {
        width: 168px;
        height: 120px;
      }
      #ui .color-field input {
        box-sizing: border-box;
        width: 168px;
        margin-top: 6px;
        padding: 3px 6px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
